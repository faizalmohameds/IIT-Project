<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { display: flex; font-family: 'Segoe UI', sans-serif; height: 100vh; }
    nav.sidebar { width: 220px; background: #2C3E50; color: #ECF0F1; padding: 20px; }
    nav.sidebar ul { list-style: none; }
    nav.sidebar li { margin: 20px 0; }
    nav.sidebar a { color: inherit; text-decoration: none; font-size: 1.1em; }
    nav.sidebar a:hover { text-decoration: underline; }
    .main { flex: 1; display: flex; flex-direction: column; }
    header.top-nav { background: #ECF0F1; padding: 15px 20px; border-bottom: 1px solid #BDC3C7; display: flex; justify-content: space-between; align-items: center; }
    .top-nav .title { font-size: 1.2em; font-weight: bold; }
    .top-nav .user { font-size: 0.9em; color: #7F8C8D; }
    .content { padding: 20px; overflow-y: auto; }
    .widget { background: #fff; border-radius: 6px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .widget h2 { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  </style>
</head>
<body>

  <nav class="sidebar">
    <h2>MyApp</h2>
    <ul>
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Users</a></li>
      <li><a href="#">Reports</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </nav>

  <div class="main">
    <header class="top-nav">
      <div class="title">Dashboard</div>
      <div class="user">Hello, Admin</div>
    </header>
    
    <div class="content">
      <div class="widget">
        <h2>Overview</h2>
        <p>Today's stats: 1,234 visitors • 76 signup conversions • 4 new messages.</p>
      </div>
      <div class="widget">
        <h2>Recent Activity</h2>
        <ul>
          <li>User "jane_doe" updated profile.</li>
          <li>"marketing.xlsx" was downloaded.</li>
          <li>"Error report" acknowledged.</li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
