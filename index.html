<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IIT Guwahati - Home</title>
  <style>
    /* Reset & base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; color: #333; line-height: 1.6; background: #f5f5f5; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    /* Header/Nav */
    header { background: #00462e; color: #fff; }
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; }
    .navbar .brand { font-size: 1.5rem; font-weight: bold; }
    .navbar ul { list-style: none; display: flex; gap: 1.5rem; }
    .navbar a { color: #fff; font-weight: 500; }
    .navbar a:hover { text-decoration: underline; }

    /* Hero */
    .hero { background: url('https://via.placeholder.com/1600x600?text=IIT+Guwahati') center/cover no-repeat; height: 60vh; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; }
    .hero::after { content: ""; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); }
    .hero h1 { position: relative; font-size: 2.5rem; color: #fff; }
    .hero p { position: relative; margin-top: 1rem; font-size: 1.1rem; color: #eee; }

    /* Main content */
    main { padding: 2rem; max-width: 1200px; margin: auto; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }

    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; }
    .card-content { padding: 1.5rem; }
    .card-content h3 { margin-bottom: 0.75rem; color: #00462e; }
    .card-content p { color: #555; }
    .card-content a { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #00462e; color: #fff; border-radius: 4px; font-size: 0.9rem; }
    .card-content a:hover { background: #003a25; }
